name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest -v

      - name: Check for known vulnerable dependencies
        run: pip install pip-audit && pip-audit -r requirements.txt || true

  # Runs only after lint-and-test passes, and only on pushes to main
  # (not on pull requests) — automatically redeploys the live EC2 server
  # with the latest code every time main is updated.
  deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/clover-crm
            git pull
            sudo docker compose up --build -d
